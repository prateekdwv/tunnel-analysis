[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-analysis"
version = "0.2.0"
description = "Reproducible measurement of visible burrowing tunnel area"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-image>=0.24", "tifffile>=2024.2", "pillow>=10", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["stackview==0.19.1", "ipympl>=0.9.8,<0.10", "ipywidgets>=8.1,<9"]

[project.scripts]
tunnel-analysis = "tunnel_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
